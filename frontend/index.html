<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23E53935'/><circle cx='16' cy='16' r='9' fill='%23FFA000'/><path d='M11 16h10M16 11v10' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>FlowTM OCC — Digital Twin & Fleet Operations</title>
    <script>
      (function() {
        try {
          const stored = localStorage.getItem("flowtm-theme") || "system";
          let resolved = stored;
          if (stored === "system") {
            resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", resolved);
          const meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.content = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
