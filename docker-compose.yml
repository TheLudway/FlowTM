services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - scenario-data:/app/data/scenarios/piloto
      - frontend-data:/app/frontend/public/data
    command:
      - sh
      - -c
      - |
        uv run --no-sync python scripts/01_preparar_escenario.py &&
        uv run --no-sync python scripts/02_correr_simulador_base.py &&
        uv run --no-sync python scripts/03_optimizar_frecuencias.py &&
        uv run --no-sync python scripts/export_frontend_data.py

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FLOWTM_SCENARIO_DIR: /app/data/scenarios/piloto
    volumes:
      - scenario-data:/app/data/scenarios/piloto:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      pipeline:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - frontend-data:/usr/share/nginx/html/data:ro
    ports:
      - "${FLOWTM_PORT:-8080}:80"

volumes:
  scenario-data:
  frontend-data:
