services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FLOWTM_SCENARIO_DIR: /app/data/scenarios/piloto
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FLOWTM_PORT:-8080}:80"
