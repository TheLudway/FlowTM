services:

  postgres:
    image: postgis/postgis:17-3.5
    container_name: transport-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: transport
      POSTGRES_USER: transport
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    secrets:
      - postgres_password

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U transport -d transport"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  loader:
    build:
      context: ./loader

    container_name: transport-loader

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: transport
      POSTGRES_USER: transport
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    volumes:
      - ../../data/processed:/data:ro
      - ./duckdb:/database      

    secrets:
      - postgres_password      


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: transport-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ludwigalvarado.me
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password

    ports:
      - "8080:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    secrets:
      - pgadmin_password

    depends_on:
      postgres:
        condition: service_healthy


  duckdb:
    image: duckdb/duckdb:1.5.5
    container_name: transport-duckdb

    volumes:
      - ../../data/processed:/data:ro
      - ./duckdb:/database

    working_dir: /database

    entrypoint: ["duckdb"]


volumes:
  postgres_data:
  pgadmin_data:


secrets:
  postgres_password:
    file: ./secrets/postgres_password
  pgadmin_password:
    file: ./secrets/pgadmin_password
